# OEM source registry. Anyone on the team can add their brand as a new
# entry without touching the rest of the code — the parser hooks in via
# `parser_key`.
#
# active: false = the brand is in the registry, but the monitor/downloader
# doesn't process it yet (waiting on a parser or on verifying the source page).

sources:
  # Škoda has both combustion models and EVs on the same page, but the
  # price list structure is completely different for them (engine/fuel/
  # transmission/drivetrain vs. battery/power/range), so they're two
  # sources with the same source_url but a different parser_key and model
  # list — this lets the EV parser be worked on without touching the ICE
  # parser (and vice versa), and makes it easy to filter by powertrain in
  # the DB/API.
  - brand: skoda
    country: cz
    # Verified 2026-07-10. The page is server-rendered, but the PDF links
    # do NOT have a .pdf extension — they look like
    # https://www.skoda-auto.cz/_doc/<uuid> (confirmed via
    # Content-Type: application/pdf); the model + document type can only
    # be told from the link text, e.g. "Octavia - Ceník".
    source_url: "https://www.skoda-auto.cz/nabidka/ceniky-katalogy"
    # Not a static filename, but a regex to find the link to the specific
    # PDF price list in the page HTML (anchor text ends with "- Ceník").
    pdf_pattern: 'href="(https://www\.skoda-auto\.cz/_doc/[a-f0-9-]+)">[^<]*-\s*Ceník</a>'
    parser_key: skoda_ice
    active: true
    models: [Fabia, Scala, Kamiq, Octavia, Karoq, Kodiaq, Superb]

  # Verified 2026-07-19 on real price lists for all four models. Enyaq
  # has two tables on one page (SUV and Coupé body styles) — SkodaEvParser
  # therefore looks for the header on every line as it goes, not just once
  # at the start of the page like ICE (where a second table is always on
  # a different page).
  - brand: skoda
    country: cz
    source_url: "https://www.skoda-auto.cz/nabidka/ceniky-katalogy"
    pdf_pattern: 'href="(https://www\.skoda-auto\.cz/_doc/[a-f0-9-]+)">[^<]*-\s*Ceník</a>'
    parser_key: skoda_ev
    active: true
    models: [Enyaq, Elroq, Epiq, Peaq]

  # Verified 2026-07-19. Unlike Škoda, VW doesn't have a single listing
  # page with all models — each model has its own price list page at
  # https://www.volkswagen.cz/<slug>/<slug>/ceniky (VolkswagenDiscoverer
  # builds that URL itself for each model in `models`; source_url here is
  # just an informational link to the model overview). pdf_pattern isn't
  # used for VW (the link is found via the data-gtm-element attribute,
  # not a regex).
  #
  # All 11 currently offered combustion/hybrid models (verified against
  # real PDFs, see commit "Rozšířit VW na všechny spalovací modely").
  # Touareg currently has no regular price list (only "Ceník akčního
  # modelu Touareg Final Edition" — the model is being phased out), so
  # VolkswagenDiscoverer won't find it for now; that's not a bug, just
  # the current state of the lineup.
  - brand: volkswagen
    country: cz
    source_url: "https://www.volkswagen.cz/modely"
    pdf_pattern: null
    parser_key: volkswagen
    active: true
    models: [Golf, Golf Variant, Passat, Polo, T-Cross, T-Roc, Taigo, Tayron, Tiguan, Touareg, Touran]

  # EVs (ID.) have a different engine-description format than ICE (and
  # it's inconsistent even among themselves — "140 kW, 58 kWh" for
  # ID.4/ID.7 vs. "50 kWh 125 kW" for ID.3 Neo/ID. Polo, see
  # VolkswagenEvParser). The "ID.3" model currently has no page of its
  # own (only "ID.3 Neo" — a refresh), so it's listed directly under that
  # name; see discovery/volkswagen.py _SLUG_OVERRIDES for each model's
  # slug (can't be derived from the name because of the period in "ID.").
  # Verified 2026-07-19 on real price lists for all five.
  - brand: volkswagen
    country: cz
    source_url: "https://www.volkswagen.cz/modely"
    pdf_pattern: null
    parser_key: volkswagen_ev
    active: true
    models: [ID.3 Neo, ID.4, ID.7, ID.7 Tourer, ID. Polo]

  # Verified 2026-08-13 on real price lists for all three models. Unlike
  # Škoda/VW, Sportage's ICE and HEV/PHEV variants are two entirely
  # separate PDF documents (not two tables on one page, not mixed rows in
  # one document) — KiaDiscoverer returns both under distinct keys
  # ("Sportage" / "Sportage HEV"), see monitors/discovery/kia.py. One
  # parser handles both since the row format is identical; powertrain
  # (ICE/MHEV/HEV/PHEV) is classified per row from the engine text, same
  # principle as Volkswagen. "Ceed" alone currently has no CZ price list
  # — only "Ceed SW" (estate) does, hence the model name here.
  - brand: kia
    country: cz
    source_url: "https://www.kia.com/cz/prodej/ceniky-katalogy/"
    pdf_pattern: null
    parser_key: kia
    active: true
    models: [Ceed SW, Sportage, Niro]

  # Verified 2026-08-13 on real price lists for all 7 documents (5 models,
  # Corolla split into 3 body styles). source_url is the REAL JSON API the
  # toyota.cz listing page itself calls client-side (found in the page's
  # inline script) — the page's own HTML has no PDF links or model data,
  # it's rendered entirely from this endpoint, so ToyotaDiscoverer fetches
  # it directly rather than scraping HTML. Toyota's catalog has two
  # recurring quirks handled generically (not hardcoded per-model) in
  # ToyotaDiscoverer: (1) each model has many documents (current + prior
  # year, "akce"/"limited_edition" promotional variants, catalogs,
  # accessories, ...) — the current plain price list is picked by
  # excluding promotional markers and taking the highest document id;
  # (2) a redesigned model can appear as two separate catalog entries, a
  # stale one under the plain name and the real current one under a
  # "Nová"/"Nový"/"Nové"-prefixed name (e.g. "RAV4" vs "Nová RAV4") — the
  # prefixed one wins on collision. Corolla Cross is deliberately not
  # included under "Corolla" — Toyota sells it as its own nameplate, not
  # a Corolla body style, see monitors/discovery/toyota.py.
  - brand: toyota
    country: cz
    source_url: "https://pdf.sites.toyota.cz/api/models-documents?_format=json&filter[active]=true&sortBy[itemOrder]=asc"
    pdf_pattern: null
    parser_key: toyota
    active: true
    models: [Yaris, Yaris Cross, Corolla, C-HR, RAV4]

  # Verified 2026-08-28. HyundaiDiscoverer fetches one page per model,
  # like Volkswagen (source_url below is just the overview page it's
  # linked from). The original placeholder model list here was
  # [i10, i20, i30, Kona, Tucson]; i10 now redirects to the i20 page
  # (discontinued in CZ) and was dropped, Bayon has a model page but no
  # discoverable price-list link at all (like VW's Touareg — simply
  # omitted, not an error), and Santa Fe was added since it's a current,
  # actively-sold model with its own price list. Tucson's HEV/PHEV lineup
  # is a separate PDF from its ICE/MHEV one — HyundaiDiscoverer returns
  # that under the "Tucson Hybrid" key (see monitors/discovery/hyundai.py),
  # which doesn't need a separate models entry here (same principle as
  # Kia's "Sportage HEV", see the kia entry above).
  - brand: hyundai
    country: cz
    source_url: "https://www.hyundai.com/cz/modely.html"
    pdf_pattern: null
    parser_key: hyundai
    active: true
    models: [i20, i30, Kona, Tucson, Santa Fe]

  # --- Remaining top-10 OEMs by CZ market share -------------------------
  # Placeholder entries (no discoverer/parser yet, same as before) for the
  # rest of the 10 best-selling brands in the Czech Republic, per 2025
  # new-passenger-car registration data (SDA figures via Cebia.cz/Auto.cz,
  # checked 2026-08-13): Škoda 33.73%, Hyundai 8.31% (now active, see
  # above), Toyota 7.49% (now active, see above), Volkswagen 6.67%, Dacia
  # 4.70%, Kia 4.37% (now active, see above), Mercedes-Benz 3.36% (now
  # active, see above), Ford 3.15%, Renault 2.97%, BMW 2.32%. `models`
  # lists each brand's current core CZ lineup (~proportional to sales
  # share) so the registry already
  # reflects the target model set once a discoverer/parser is written for
  # that brand — activating one is then just flipping `active: true` and
  # filling in `pdf_pattern` (regex or null, depending on whether the
  # discoverer needs one, same as Škoda vs. VW above).
  #
  # source_url below is informational only until each brand's discoverer
  # is written (no discover() implementation reads it yet). Checked
  # 2026-08-13: Dacia/Kia/Renault confirmed reachable (HTTP 200) with a
  # single page listing PDF price lists for multiple/all models directly,
  # same pattern as Škoda. Ford and BMW pages were found by search with
  # titles matching "price lists/catalogs for download" but could not be
  # fetched from this environment (TLS/network timeout on ford.cz and
  # bmw.cz specifically) — URL not independently verified, re-check before
  # building a discoverer against it.

  - brand: dacia
    country: cz
    source_url: "https://www.dacia.cz/ceniky-a-brozury.html"
    pdf_pattern: null
    parser_key: dacia
    active: false
    models: [Sandero, Duster, Jogger]

  # Verified 2026-08-29. Unlike every other brand above, Mercedes-Benz
  # doesn't publish a PDF per model at all - the ceniky.html page below
  # links ONE combined "Souhrnný ceník" covering the entire current
  # lineup (74 pages, all body styles), so MercedesBenzDiscoverer doesn't
  # do per-model discovery like Volkswagen/Hyundai, it just finds that
  # one document (see monitors/discovery/mercedes_benz.py - the link
  # isn't in the rendered HTML as a plain <a href>, it's read out of an
  # inline JSON payload instead). MercedesBenzParser then picks the
  # models below out of the combined PDF by their own chapter heading and
  # ignores the rest (A-Class, GLA, GLC, S-Class, EQ*, AMG, ...) - see
  # that parser's module docstring. Sedan and estate ("kombi") are
  # separate chapters in the source and come out as "C-Class"/"C-Class
  # Estate" and "E-Class"/"E-Class Estate" respectively - the Estate
  # variants don't need their own entry here, same principle as Hyundai's
  # "Tucson Hybrid" note above.
  - brand: mercedes-benz
    country: cz
    source_url: "https://www.mercedes-benz.cz/passengercars/services/ceniky.html"
    pdf_pattern: null
    parser_key: mercedes-benz
    active: true
    models: [C-Class, E-Class]

  # Not one of the top-10-by-CZ-market-share brands above - added because
  # backend/app/db/seed.py's hand-verified demo vehicle is a Mazda CX-5,
  # and until this source existed that was the ONLY Mazda data in the
  # catalog (2 configurations). Verified 2026-08-29: a single listing page
  # (like Škoda), but client-rendered - the PDF links are read out of an
  # inline JSON payload the same way as Mercedes-Benz's, see
  # monitors/discovery/mazda.py. Mazda's price-list PDFs are themselves
  # unlike any other brand's here (a 25-38 page interactive-brochure
  # export, not a plain price table) - see parsers/mazda.py's module
  # docstring for the extraction technique this needed. "3" (hatchback,
  # the default nameplate) and "3 Sedan" both come from the "3" entry
  # below, same principle as Mercedes-Benz's sedan/estate split - a
  # separate models entry isn't needed for the Sedan variant.
  - brand: mazda
    country: cz
    source_url: "https://www.mazda.cz/formulae/cenik/"
    pdf_pattern: null
    parser_key: mazda
    active: true
    models: [CX-5, "3", CX-30]

  - brand: ford
    country: cz
    # Not fetch-verified — see note above.
    source_url: "https://www.ford.cz/pred-nakupem/dalsi-kroky/katalogy-a-ceniky-ke-stazeni"
    pdf_pattern: null
    parser_key: ford
    active: false
    models: [Puma, Kuga]

  - brand: renault
    country: cz
    source_url: "https://www.renault.cz/ceniky-a-brozury.html"
    pdf_pattern: null
    parser_key: renault
    active: false
    models: [Clio, Captur]

  - brand: bmw
    country: cz
    # Not fetch-verified — see note above.
    source_url: "https://www.bmw.cz/cs/topics/details/katalogy-ceniky-ke-stazeni.html"
    pdf_pattern: null
    parser_key: bmw
    active: false
    models: [X1]
