# OEM source registry. Anyone on the team can add their brand as a new
# entry without touching the rest of the code — the parser hooks in via
# `parser_key`.
#
# active: false = the brand is in the registry, but the monitor/downloader
# doesn't process it yet (waiting on a parser or on verifying the source page).

sources:
  # Škoda has both combustion models and EVs on the same page, but the
  # price list structure is completely different for them (engine/fuel/
  # transmission/drivetrain vs. battery/power/range), so they're two
  # sources with the same source_url but a different parser_key and model
  # list — this lets the EV parser be worked on without touching the ICE
  # parser (and vice versa), and makes it easy to filter by powertrain in
  # the DB/API.
  - brand: skoda
    country: cz
    # Verified 2026-07-10. The page is server-rendered, but the PDF links
    # do NOT have a .pdf extension — they look like
    # https://www.skoda-auto.cz/_doc/<uuid> (confirmed via
    # Content-Type: application/pdf); the model + document type can only
    # be told from the link text, e.g. "Octavia - Ceník".
    source_url: "https://www.skoda-auto.cz/nabidka/ceniky-katalogy"
    # Not a static filename, but a regex to find the link to the specific
    # PDF price list in the page HTML (anchor text ends with "- Ceník").
    pdf_pattern: 'href="(https://www\.skoda-auto\.cz/_doc/[a-f0-9-]+)">[^<]*-\s*Ceník</a>'
    parser_key: skoda_ice
    active: true
    models: [Fabia, Scala, Kamiq, Octavia, Karoq, Kodiaq, Superb]

  # Verified 2026-07-19 on real price lists for all four models. Enyaq
  # has two tables on one page (SUV and Coupé body styles) — SkodaEvParser
  # therefore looks for the header on every line as it goes, not just once
  # at the start of the page like ICE (where a second table is always on
  # a different page).
  - brand: skoda
    country: cz
    source_url: "https://www.skoda-auto.cz/nabidka/ceniky-katalogy"
    pdf_pattern: 'href="(https://www\.skoda-auto\.cz/_doc/[a-f0-9-]+)">[^<]*-\s*Ceník</a>'
    parser_key: skoda_ev
    active: true
    models: [Enyaq, Elroq, Epiq, Peaq]

  # Verified 2026-07-19. Unlike Škoda, VW doesn't have a single listing
  # page with all models — each model has its own price list page at
  # https://www.volkswagen.cz/<slug>/<slug>/ceniky (VolkswagenDiscoverer
  # builds that URL itself for each model in `models`; source_url here is
  # just an informational link to the model overview). pdf_pattern isn't
  # used for VW (the link is found via the data-gtm-element attribute,
  # not a regex).
  #
  # All 11 currently offered combustion/hybrid models (verified against
  # real PDFs, see commit "Rozšířit VW na všechny spalovací modely").
  # Touareg currently has no regular price list (only "Ceník akčního
  # modelu Touareg Final Edition" — the model is being phased out), so
  # VolkswagenDiscoverer won't find it for now; that's not a bug, just
  # the current state of the lineup.
  - brand: volkswagen
    country: cz
    source_url: "https://www.volkswagen.cz/modely"
    pdf_pattern: null
    parser_key: volkswagen
    active: true
    models: [Golf, Golf Variant, Passat, Polo, T-Cross, T-Roc, Taigo, Tayron, Tiguan, Touareg, Touran]

  # EVs (ID.) have a different engine-description format than ICE (and
  # it's inconsistent even among themselves — "140 kW, 58 kWh" for
  # ID.4/ID.7 vs. "50 kWh 125 kW" for ID.3 Neo/ID. Polo, see
  # VolkswagenEvParser). The "ID.3" model currently has no page of its
  # own (only "ID.3 Neo" — a refresh), so it's listed directly under that
  # name; see discovery/volkswagen.py _SLUG_OVERRIDES for each model's
  # slug (can't be derived from the name because of the period in "ID.").
  # Verified 2026-07-19 on real price lists for all five.
  - brand: volkswagen
    country: cz
    source_url: "https://www.volkswagen.cz/modely"
    pdf_pattern: null
    parser_key: volkswagen_ev
    active: true
    models: [ID.3 Neo, ID.4, ID.7, ID.7 Tourer, ID. Polo]

  # --- Remaining top-10 OEMs by CZ market share -------------------------
  # Placeholder entries (no discoverer/parser yet, same as before) for the
  # rest of the 10 best-selling brands in the Czech Republic, per 2025
  # new-passenger-car registration data (SDA figures via Cebia.cz/Auto.cz,
  # checked 2026-08-13): Škoda 33.73%, Hyundai 8.31%, Toyota 7.49%,
  # Volkswagen 6.67%, Dacia 4.70%, Kia 4.37%, Mercedes-Benz 3.36%,
  # Ford 3.15%, Renault 2.97%, BMW 2.32%. `models` lists each brand's
  # current core CZ lineup (~proportional to sales share) so the registry
  # already reflects the target model set once a discoverer/parser is
  # written for that brand — activating one is then just flipping
  # `active: true` and filling in `pdf_pattern` (regex or null, depending
  # on whether the discoverer needs one, same as Škoda vs. VW above).
  #
  # source_url below is informational only until each brand's discoverer
  # is written (no discover() implementation reads it yet). Checked
  # 2026-08-13: Dacia/Kia/Renault confirmed reachable (HTTP 200) with a
  # single page listing PDF price lists for multiple/all models directly,
  # same pattern as Škoda. Hyundai/Toyota confirmed reachable but are
  # overview pages linking out to a separate price-list page per model
  # (pattern closer to VW — a future discoverer would build per-model
  # URLs, not scrape this page directly). Ford and BMW pages were found by
  # search with titles matching "price lists/catalogs for download" but
  # could not be fetched from this environment (TLS/network timeout on
  # ford.cz and bmw.cz specifically) — URL not independently verified,
  # re-check before building a discoverer against it. Mercedes-Benz has no
  # single ceníky hub — price lists live on per-model, per-body-style
  # pages with generation-code URLs (e.g. .../models/gle/suv-v167/...);
  # left null pending a proper investigation of that structure.

  - brand: hyundai
    country: cz
    source_url: "https://www.hyundai.com/cz/modely.html"
    pdf_pattern: null
    parser_key: hyundai
    active: false
    models: [i10, i20, i30, Kona, Tucson]

  - brand: toyota
    country: cz
    source_url: "https://www.toyota.cz/koupe-a-nabidky/ceniky"
    pdf_pattern: null
    parser_key: toyota
    active: false
    models: [Yaris, Yaris Cross, Corolla, C-HR, RAV4]

  - brand: dacia
    country: cz
    source_url: "https://www.dacia.cz/ceniky-a-brozury.html"
    pdf_pattern: null
    parser_key: dacia
    active: false
    models: [Sandero, Duster, Jogger]

  - brand: kia
    country: cz
    source_url: "https://www.kia.com/cz/prodej/ceniky-katalogy/"
    pdf_pattern: null
    parser_key: kia
    active: false
    models: [Ceed, Sportage, Niro]

  - brand: mercedes-benz
    country: cz
    source_url: null
    pdf_pattern: null
    parser_key: mercedes-benz
    active: false
    models: [C-Class, E-Class]

  - brand: ford
    country: cz
    # Not fetch-verified — see note above.
    source_url: "https://www.ford.cz/pred-nakupem/dalsi-kroky/katalogy-a-ceniky-ke-stazeni"
    pdf_pattern: null
    parser_key: ford
    active: false
    models: [Puma, Kuga]

  - brand: renault
    country: cz
    source_url: "https://www.renault.cz/ceniky-a-brozury.html"
    pdf_pattern: null
    parser_key: renault
    active: false
    models: [Clio, Captur]

  - brand: bmw
    country: cz
    # Not fetch-verified — see note above.
    source_url: "https://www.bmw.cz/cs/topics/details/katalogy-ceniky-ke-stazeni.html"
    pdf_pattern: null
    parser_key: bmw
    active: false
    models: [X1]
